<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>pocketlab</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .nav-item.active .nav-icon { color: #818cf8; }
  .nav-item.active .nav-label { color: #c7d2fe; }
  .shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.5rem; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.8s linear infinite; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  input { font-size: 16px; }
  .toast { animation: toastIn 0.25s ease-out, toastOut 0.3s ease-in 2.7s forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
  .bar-fill { transition: width 0.5s ease; }
  .pull-arrow { transition: transform 0.2s; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen select-none">

<!-- Toasts -->
<div id="toasts" class="fixed left-4 right-4 z-[100] flex flex-col items-center gap-2 pointer-events-none" style="top: calc(1rem + var(--safe-top))"></div>

<!-- Header -->
<header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/90 backdrop-blur-lg border-b border-slate-800/50" style="padding-top: var(--safe-top)">
  <div class="flex items-center justify-between px-4 py-2.5">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-sm font-bold">P</div>
      <span class="font-semibold text-sm" id="headerTitle">pocketlab</span>
    </div>
    <button id="refreshBtn" onclick="reloadCurrent()" class="text-xs text-slate-500 flex items-center gap-1.5 active:text-slate-300">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>Refresh</span>
    </button>
  </div>
</header>

<!-- Content -->
<main id="content" class="pt-12 pb-20" style="padding-top: calc(3rem + var(--safe-top)); padding-bottom: calc(5rem + var(--safe-bottom))">
  <div id="pullIndicator" class="text-center text-xs text-slate-500 pt-2 hidden">
    <span class="pull-arrow inline-block">&#8595;</span> Pull to refresh
  </div>
  <div id="panels"></div>
</main>

<!-- Bottom nav (built from config) -->
<nav id="nav" class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800/50 grid" style="padding-bottom: var(--safe-bottom)"></nav>

<script>
// ── widget metadata: label + bottom-nav icon (heroicons-style paths) ──
const WIDGETS = {
  system:   { label: 'System',   title: 'System',    icon: 'M9 17V7m4 10V11m4 6V9M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5z' },
  docker:   { label: 'Docker',   title: 'Containers', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4' },
  files:    { label: 'Files',    title: 'Files',     icon: 'M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z' },
  terminal: { label: 'Terminal', title: 'Terminals', icon: 'M8 9l3 3-3 3m5 0h3M4 5a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2H4z' },
  links:    { label: 'Services', title: 'Services',  icon: 'M13.828 10.172a4 4 0 010 5.656l-3 3a4 4 0 01-5.656-5.656l1.5-1.5M10.172 13.828a4 4 0 010-5.656l3-3a4 4 0 015.656 5.656l-1.5 1.5' },
};

let CFG = null;
let currentTab = null;

// ── helpers ──
function $(id) { return document.getElementById(id); }
function esc(s) { const d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }

async function apiFetch(url, opts = {}) {
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(20000), ...opts });
    if (!r.ok) { let msg = 'HTTP ' + r.status; try { const j = await r.json(); if (j.error || j.detail) msg = j.error || j.detail; } catch (_) {} throw new Error(msg); }
    return await r.json();
  } catch (e) { console.error('API error:', url, e); return { __error: String(e.message || e) }; }
}

function toast(msg, type = 'info') {
  const colors = { info: 'bg-slate-700', success: 'bg-emerald-700', error: 'bg-red-700' };
  const el = document.createElement('div');
  el.className = `toast ${colors[type] || colors.info} text-white text-sm px-4 py-2 rounded-lg shadow-lg pointer-events-auto`;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  if (n < 1099511627776) return (n / 1073741824).toFixed(1) + ' GB';
  return (n / 1099511627776).toFixed(2) + ' TB';
}

function fmtUptime(s) {
  s = Number(s) || 0;
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}

function fmtDate(epoch) {
  if (!epoch) return '';
  try { return new Date(epoch * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch (_) { return ''; }
}

function usageColor(pct) {
  if (pct < 60) return 'bg-emerald-500';
  if (pct < 85) return 'bg-amber-500';
  return 'bg-red-500';
}
function tempColor(t) { return t < 60 ? 'text-emerald-400' : t < 80 ? 'text-amber-400' : 'text-red-400'; }

function errBox(msg) {
  return `<div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-300">${esc(msg)}</div>`;
}

// ── boot ──
async function boot() {
  CFG = await apiFetch('/api/config');
  if (CFG.__error) { $('panels').innerHTML = errBox('Could not load config: ' + CFG.__error); return; }
  document.title = CFG.title || 'pocketlab';
  $('headerTitle').textContent = CFG.title || 'pocketlab';

  const widgets = (CFG.widgets || []).filter(w => WIDGETS[w]);
  if (!widgets.length) { $('panels').innerHTML = errBox('No widgets enabled in config.'); return; }

  // Panels
  $('panels').innerHTML = widgets.map(w =>
    `<div id="tab-${w}" class="tab-panel px-4 py-3 space-y-5"></div>`
  ).join('');

  // Nav
  const nav = $('nav');
  nav.style.gridTemplateColumns = `repeat(${widgets.length}, minmax(0, 1fr))`;
  nav.innerHTML = widgets.map(w => `
    <button class="nav-item flex flex-col items-center py-2 gap-0.5" data-tab="${w}" onclick="switchTab('${w}')">
      <svg class="nav-icon w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${WIDGETS[w].icon}"/></svg>
      <span class="nav-label text-[10px] text-slate-500">${esc(WIDGETS[w].label)}</span>
    </button>`).join('');

  switchTab(widgets[0]);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
}

function switchTab(tab) {
  currentTab = tab;
  $('headerTitle').textContent = WIDGETS[tab]?.title || CFG.title || 'pocketlab';
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $(`tab-${tab}`).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`)?.classList.add('active');
  reloadCurrent();
}

function reloadCurrent() {
  const loaders = { system: loadSystem, docker: loadDocker, files: loadFiles, terminal: renderTerminal, links: loadLinks };
  (loaders[currentTab] || (() => {}))();
}

// ── widget: SYSTEM ──
function shimmerCards(n, h) { return Array.from({ length: n }, () => `<div class="shimmer ${h}"></div>`).join(''); }

async function loadSystem() {
  const panel = $('tab-system');
  if (!panel.dataset.loaded) panel.innerHTML = `<div class="space-y-3">${shimmerCards(2, 'h-40')}</div>`;
  const data = await apiFetch('/api/system');
  panel.dataset.loaded = '1';
  if (data.__error) { panel.innerHTML = errBox('Failed to load system stats: ' + data.__error); return; }
  panel.innerHTML = (data.hosts || []).map(renderHostCard).join('') || '<div class="text-sm text-slate-500">No hosts configured.</div>';
}

function renderHostCard(h) {
  if (!h.online) {
    return `<div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
      <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500"></span><span class="font-medium text-sm">${esc(h.host)}</span></div>
      <div class="text-xs text-red-400 mt-2">Offline — ${esc(h.error || 'unreachable')}</div></div>`;
  }
  const mem = h.mem || { percent: 0 };
  const disks = (h.disks || []).map(d => `
    <div>
      <div class="flex justify-between text-[10px] text-slate-400 mb-0.5"><span class="font-mono truncate">${esc(d.mount)}</span><span>${fmtBytes(d.used)} / ${fmtBytes(d.total)}</span></div>
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bar-fill ${usageColor(d.percent)}" style="width:${d.percent}%"></div></div>
    </div>`).join('');
  const temps = (h.temps || []).slice(0, 4).map(t =>
    `<span class="text-[10px] ${tempColor(t.celsius)}">${esc(t.label)} ${Math.round(t.celsius)}&deg;</span>`).join('<span class="text-slate-700">·</span>');

  return `<div class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="font-medium text-sm">${esc(h.host)}</span><span class="text-[10px] text-slate-500">${esc(h.hostname || '')}</span></div>
      <span class="text-[10px] text-slate-500">up ${fmtUptime(h.uptime)}</span>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div><div class="text-lg font-bold text-indigo-400">${Math.round(h.cpu_percent)}%</div><div class="text-[10px] text-slate-500">CPU · ${h.cpu_count || '?'}c</div></div>
      <div><div class="text-lg font-bold text-sky-400">${Math.round(mem.percent)}%</div><div class="text-[10px] text-slate-500">${fmtBytes(mem.used)} RAM</div></div>
      <div><div class="text-sm font-bold text-slate-300 mt-1">${(h.load || []).map(x => x.toFixed(1)).join(' ')}</div><div class="text-[10px] text-slate-500">load</div></div>
    </div>
    ${disks ? `<div class="space-y-1.5">${disks}</div>` : ''}
    ${temps ? `<div class="flex flex-wrap gap-x-2 gap-y-1 items-center pt-1">${temps}</div>` : ''}
  </div>`;
}

// ── widget: LINKS ──
async function loadLinks() {
  const panel = $('tab-links');
  const data = await apiFetch('/api/links');
  if (data.__error) { panel.innerHTML = errBox(data.__error); return; }
  const groups = data.groups || [];
  if (!groups.length) { panel.innerHTML = '<div class="text-sm text-slate-500">No links configured. Add a <code>links:</code> section to your config.</div>'; return; }
  panel.innerHTML = groups.map(g => `
    <div>
      <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">${esc(g.group)}</h2>
      <div class="grid grid-cols-2 gap-2">
        ${(g.items || []).map(s => `
          <a href="${encodeURI(s.url)}" target="_blank" rel="noopener" class="bg-slate-900 border border-slate-800 rounded-lg p-3 flex items-start gap-2.5 active:bg-slate-800 min-h-[56px]">
            <span class="text-lg flex-shrink-0 mt-0.5">${esc(s.icon || '🔗')}</span>
            <div class="min-w-0"><div class="text-sm font-medium text-slate-200 truncate">${esc(s.name)}</div>${s.desc ? `<div class="text-[10px] text-slate-500 truncate">${esc(s.desc)}</div>` : ''}</div>
          </a>`).join('')}
      </div>
    </div>`).join('');
}

// ── widget: DOCKER ──
async function loadDocker() {
  const panel = $('tab-docker');
  if (!panel.dataset.loaded) panel.innerHTML = `<div class="space-y-2">${shimmerCards(5, 'h-14')}</div>`;
  const data = await apiFetch('/api/docker/containers');
  panel.dataset.loaded = '1';
  if (data.__error) { panel.innerHTML = errBox(data.__error); return; }
  const list = data.containers || [];
  if (!list.length) { panel.innerHTML = errBox(data.error || 'No containers found.'); return; }
  panel.innerHTML = `<div class="space-y-2">` + list.map(c => {
    const running = c.state === 'running';
    const dot = running ? 'bg-emerald-500' : (c.state === 'paused' ? 'bg-amber-500' : 'bg-slate-600');
    return `<div class="bg-slate-900 rounded-xl p-3 border border-slate-800 flex items-center gap-3">
      <span class="w-2 h-2 rounded-full ${dot} flex-shrink-0"></span>
      <div class="flex-1 min-w-0"><div class="text-sm font-medium text-slate-200 truncate">${esc(c.name)}</div><div class="text-[10px] text-slate-500 truncate">${esc(c.image)} · ${esc(c.state)}</div></div>
      <div class="flex gap-1 flex-shrink-0">
        ${running
          ? `<button onclick="dockerAction('${esc(c.id)}','restart',this)" class="text-[11px] px-2 py-1 rounded bg-slate-700/70 text-slate-200 active:bg-slate-600">↻</button>
             <button onclick="dockerAction('${esc(c.id)}','stop',this)" class="text-[11px] px-2 py-1 rounded bg-red-500/20 text-red-300 active:bg-red-500/30">Stop</button>`
          : `<button onclick="dockerAction('${esc(c.id)}','start',this)" class="text-[11px] px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 active:bg-emerald-500/30">Start</button>`}
      </div>
    </div>`;
  }).join('') + `</div>`;
}

async function dockerAction(id, action, btn) {
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '…';
  const r = await apiFetch(`/api/docker/containers/${id}/${action}`, { method: 'POST' });
  if (r.__error) { toast(r.__error, 'error'); btn.textContent = orig; btn.disabled = false; }
  else { toast(`${action} ok`, 'success'); setTimeout(loadDocker, 600); }
}

// ── widget: FILES ──
let fileState = { root: null, path: null };

async function loadFiles() {
  const panel = $('tab-files');
  const roots = (CFG.files && CFG.files.roots) || [];
  if (!roots.length) { panel.innerHTML = '<div class="text-sm text-slate-500">No file roots configured. Add a <code>files.roots</code> section to your config.</div>'; return; }
  if (!fileState.root) fileState.root = roots[0];
  if (!panel.dataset.built) {
    panel.innerHTML = `
      <div id="fileRoots" class="flex gap-1.5 flex-wrap"></div>
      <div id="fileBreadcrumb" class="text-[11px] text-slate-500 flex flex-wrap gap-1 items-center"></div>
      <div class="flex justify-end">
        <label class="text-[11px] px-3 py-1.5 rounded-lg bg-indigo-500/20 text-indigo-200 active:bg-indigo-500/30 cursor-pointer">Upload<input type="file" id="fileInput" class="hidden" multiple onchange="uploadFiles(this.files)"></label>
      </div>
      <div id="fileUploads" class="space-y-2"></div>
      <div id="fileList" class="space-y-1.5"></div>`;
    panel.dataset.built = '1';
  }
  $('fileRoots').innerHTML = roots.map(r =>
    `<button onclick="switchRoot('${esc(r)}')" class="text-[11px] px-2.5 py-1 rounded-lg ${r === fileState.root ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}">${esc(r)}</button>`).join('');
  browseFiles(fileState.path);
}

function switchRoot(root) { fileState.root = root; fileState.path = null; loadFiles(); }

async function browseFiles(path) {
  const list = $('fileList');
  list.innerHTML = `<div class="shimmer h-12"></div>`.repeat(4);
  const q = new URLSearchParams({ root: fileState.root }); if (path) q.set('path', path);
  const data = await apiFetch('/api/files/browse?' + q.toString());
  if (data.__error) { list.innerHTML = errBox(data.__error); return; }
  fileState.path = data.path;
  renderBreadcrumb(data.path);
  const entries = (data.entries || []).sort((a, b) => (b.is_dir - a.is_dir) || a.name.localeCompare(b.name));
  const parent = data.path.includes('/') && data.path !== '/' ? data.path.replace(/\/[^/]*$/, '') || '/' : null;
  let html = '';
  if (parent !== null && parent !== data.path) html += fileRow('..', '⬆️', () => `browseFiles('${escJs(parent)}')`, 'Parent');
  for (const e of entries) {
    const full = (data.path.replace(/\/$/, '')) + '/' + e.name;
    if (e.is_dir) html += fileRow(e.name, '📁', () => `browseFiles('${escJs(full)}')`, 'Directory');
    else html += fileRow(e.name, fileIcon(e.name), () => `downloadFile('${escJs(full)}')`, `${fmtBytes(e.size)} · ${fmtDate(e.modified)}`, 'Download');
  }
  list.innerHTML = html || '<div class="text-sm text-slate-500 py-6 text-center">Empty directory</div>';
}

function fileRow(name, icon, onclickFn, meta, action) {
  return `<div onclick="${onclickFn()}" class="bg-slate-900 rounded-lg px-3 py-2.5 flex items-center gap-3 active:bg-slate-800 cursor-pointer">
    <span class="text-base flex-shrink-0">${icon}</span>
    <div class="flex-1 min-w-0"><div class="text-sm text-slate-200 truncate">${esc(name)}</div><div class="text-[10px] text-slate-500 truncate">${esc(meta)}</div></div>
    ${action ? `<span class="text-[11px] text-indigo-400 flex-shrink-0">${action}</span>` : ''}
  </div>`;
}

function renderBreadcrumb(path) {
  const parts = path.split('/').filter(Boolean);
  let cum = '', html = `<button onclick="browseFiles('/')" class="text-indigo-400">/</button>`;
  for (const p of parts) { cum += '/' + p; const cp = cum; html += `<span>/</span><button onclick="browseFiles('${escJs(cp)}')" class="text-indigo-400">${esc(p)}</button>`; }
  $('fileBreadcrumb').innerHTML = html;
}

async function downloadFile(path) {
  const q = new URLSearchParams({ root: fileState.root, path });
  window.location.href = '/api/files/download?' + q.toString();
}

async function uploadFiles(files) {
  const area = $('fileUploads');
  for (const file of files) {
    const id = 'up-' + Math.random().toString(36).slice(2, 8);
    area.insertAdjacentHTML('beforeend', `<div id="${id}" class="bg-slate-900 rounded-lg px-3 py-2 text-xs"><div class="flex justify-between"><span class="truncate">${esc(file.name)}</span><span id="${id}-s">0%</span></div><div class="h-1 bg-slate-800 rounded mt-1 overflow-hidden"><div id="${id}-b" class="h-full bg-indigo-500" style="width:0%"></div></div></div>`);
    const fd = new FormData(); fd.append('file', file);
    const q = new URLSearchParams({ root: fileState.root }); if (fileState.path) q.set('path', fileState.path);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/files/upload?' + q.toString());
    xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); $(id + '-s').textContent = p + '%'; $(id + '-b').style.width = p + '%'; } };
    xhr.onload = () => { const ok = xhr.status === 200; $(id + '-s').textContent = ok ? 'done' : ('err ' + xhr.status); $(id + '-b').style.background = ok ? '#10b981' : '#ef4444'; if (ok) setTimeout(() => { $(id).remove(); browseFiles(fileState.path); }, 1200); };
    xhr.onerror = () => { $(id + '-s').textContent = 'network error'; $(id + '-b').style.background = '#ef4444'; };
    xhr.send(fd);
  }
  $('fileInput').value = '';
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const m = { pdf: '📄', py: '🐍', go: '🔵', js: '📜', ts: '📜', html: '🌐', md: '📝', txt: '📝', log: '📝', json: '📋', yaml: '📋', yml: '📋', toml: '⚙️', conf: '⚙️', sh: '⚙️', zip: '📦', tar: '📦', gz: '📦', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', svg: '🖼️', mp4: '🎬', mkv: '🎬', mp3: '🎵', db: '🗄️', sqlite: '🗄️' };
  return m[ext] || '📄';
}
function escJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

// ── widget: TERMINAL ──
function renderTerminal() {
  const panel = $('tab-terminal');
  const t = CFG.terminal || {};
  const base = (t.mttyd_url || '/term-app').replace(/\/$/, '');
  const ports = t.ports || [];
  if (!ports.length) { panel.innerHTML = '<div class="text-sm text-slate-500">No terminal ports configured.</div>'; return; }
  panel.innerHTML = `<div class="text-[11px] text-slate-500 mb-1">Opens a mobile-friendly terminal (powered by <a href="https://github.com/JeremiahM37/mttyd" target="_blank" rel="noopener" class="text-indigo-400">mttyd</a>). ttyd must be running on each port.</div>` +
    ports.map((p, i) => {
      const label = (t.labels && t.labels[i]) || ('Port ' + p);
      return `<a href="${base}/term/${p}" target="_blank" rel="noopener" class="flex items-center gap-3 p-4 bg-slate-900 rounded-xl border border-slate-800 active:bg-slate-800">
        <div class="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center flex-shrink-0"><svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3"/></svg></div>
        <div class="flex-1 min-w-0"><div class="text-sm font-medium text-white">${esc(label)}</div><div class="text-xs text-slate-400">:${p}</div></div>
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M3 12h18"/></svg>
      </a>`;
    }).join('');
}

// ── pull-to-refresh ──
let pullStartY = 0, isPulling = false;
window.addEventListener('touchstart', e => { if (window.scrollY <= 0) { pullStartY = e.touches[0].clientY; isPulling = true; } }, { passive: true });
window.addEventListener('touchmove', e => {
  if (!isPulling) return;
  const dy = e.touches[0].clientY - pullStartY;
  const ind = $('pullIndicator');
  if (dy > 10) { ind.classList.remove('hidden'); ind.querySelector('.pull-arrow').style.transform = dy > 70 ? 'rotate(180deg)' : 'none'; }
}, { passive: true });
window.addEventListener('touchend', e => {
  if (!isPulling) return;
  const dy = (e.changedTouches[0].clientY - pullStartY);
  $('pullIndicator').classList.add('hidden');
  if (dy > 70 && window.scrollY <= 0) { reloadCurrent(); toast('Refreshed'); }
  isPulling = false;
}, { passive: true });

boot();
</script>
</body>
</html>
